services:
  backend:
    build: ./backend
    environment:
      SECUREDATA_DEMO_MODE: "true"
      SECUREDATA_DATABASE_URL: sqlite:///./data/securedata.db
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/securedata/backend/data
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
